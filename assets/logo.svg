<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aurelia Cove emblem">
  <defs>
    <linearGradient id="ac-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d9a8"/>
      <stop offset="0.55" stop-color="#c49a52"/>
      <stop offset="1" stop-color="#9a6f2e"/>
    </linearGradient>
  </defs>

  <!-- double crest -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#ac-gold)" stroke-width="1.7"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#ac-gold)" stroke-width="0.7" opacity="0.55"/>

  <!-- rising sun -->
  <circle cx="32" cy="25" r="8.5" fill="url(#ac-gold)"/>
  <path d="M32 10.5v3.5M20.5 15l2.4 2.4M43.5 15l-2.4 2.4" stroke="url(#ac-gold)" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>

  <!-- horizon -->
  <path d="M14 33.5h36" stroke="url(#ac-gold)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- the cove: two sweeping waves -->
  <path d="M14 40.5c6.5-7 12.5 6.5 19-0.5s12.5-6 17 0.5" fill="none" stroke="url(#ac-gold)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M16.5 47.5c6-5.5 11.5 4.5 18-1.5s10.5-4.5 13-1.5" fill="none" stroke="url(#ac-gold)" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
</svg>
